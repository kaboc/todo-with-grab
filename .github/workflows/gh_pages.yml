name: Gh-Pages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
      - name: Update dependencies
        run: flutter pub upgrade
      - uses: bluefireteam/flutter-gh-pages@v9
        with:
          baseHref: /todo-with-grab/
